name: Deploy Contract

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    defaults:
      run:
        working-directory: contracts/chronicle-game-state
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Deploy to ${{ inputs.network }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_ADMIN_SECRET_KEY }}
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/chronicle_game_state.wasm \
            --network ${{ inputs.network }} \
            --source admin 2>&1 | tail -1)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ID"
      - name: Initialize contract
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_ADMIN_SECRET_KEY }}
        run: |
          stellar contract invoke \
            --id ${{ steps.deploy.outputs.contract_id }} \
            --fn initialize \
            --arg admin=${{ secrets.STELLAR_ADMIN_PUBLIC_KEY }} \
            --network ${{ inputs.network }} \
            --source admin
